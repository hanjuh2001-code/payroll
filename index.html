<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퇴직금 · 4대보험 상담 챗봇</title>

<style>
:root{
    --orange:#f58220;
    --orange-dark:#d96b12;
    --orange-soft:#fff4e9;
    --bg:#f4f4f1;
    --panel:#ffffff;
    --bot:#ffffff;
    --user:#f58220;
    --text:#333;
    --sub:#777;
    --border:#e7e7e2;
    --link:#2f6fa5;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
    margin:0;
    font-family:"Malgun Gothic",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}
.app{
    width:min(820px,100%);
    height:100vh;
    margin:0 auto;
    background:#ecece8;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 24px rgba(0,0,0,.08);
}
.header{
    flex:none;
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}
.header-left{display:flex;align-items:center;gap:12px}
.bot-avatar{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--orange-soft);font-size:21px;
}
.header-title{font-weight:bold;font-size:17px}
.header-sub{font-size:12px;color:var(--sub);margin-top:3px}
.header button{
    border:1px solid #ddd;background:white;color:#555;
    border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:bold;
}
.chat{
    flex:1;
    overflow-y:auto;
    padding:22px 18px 28px;
}
.row{display:flex;margin:10px 0;align-items:flex-end;gap:8px}
.row.user{justify-content:flex-end}
.mini-avatar{
    flex:none;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--orange-soft);font-size:14px;
}
.bubble{
    max-width:76%;
    padding:13px 15px;
    border-radius:16px;
    line-height:1.7;
    font-size:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
    word-break:keep-all;
}
.bot .bubble{
    background:var(--bot);
    border:1px solid var(--border);
    border-bottom-left-radius:5px;
}
.user .bubble{
    background:var(--user);
    color:white;
    border-bottom-right-radius:5px;
}
.bubble table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    margin:10px 0;
    background:white;
    color:#333;
}
.bubble th,.bubble td{
    border:1px solid #ddd;padding:7px;text-align:center;
    font-size:12px;
}
.bubble th{background:#f5f5f2}
.answer-title{
    display:block;margin-top:12px;font-weight:bold;color:#444;
}
.answer-box{
    background:#f7f7f5;border-left:3px solid var(--orange);
    padding:10px 12px;margin:8px 0;border-radius:5px;
}
.notice-box{
    background:#fff8ee;border:1px solid #f4d6b5;
    padding:10px 12px;margin:8px 0;border-radius:6px;
}
.related{margin-top:12px;padding-top:10px;border-top:1px dashed #ddd}
.related-title{display:block;font-weight:bold;margin-bottom:5px}
.related-link{
    display:block;color:var(--link);font-weight:bold;
    text-decoration:none;margin-top:4px;cursor:pointer;
}
mark{background:#fff1a8;padding:0 2px;border-radius:2px}
.quick{
    display:flex;flex-wrap:wrap;gap:7px;
    margin:12px 0 4px 38px;
}
.quick button{
    background:white;border:1px solid #ddd;color:#555;
    padding:7px 10px;border-radius:18px;cursor:pointer;font-size:12px;
}
.quick button:hover{border-color:#efb47f;background:#fff7ef}
.typing .bubble{color:#888}
.dot{animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{
    flex:none;background:white;border-top:1px solid var(--border);
    padding:12px;
}
.input-wrap{display:flex;gap:8px}
#messageInput{
    flex:1;min-width:0;border:1px solid #ddd;border-radius:12px;
    padding:13px 14px;font-size:14px;outline:none;background:#fafafa;
}
#messageInput:focus{background:white;border-color:var(--orange)}
.send{
    border:none;background:var(--orange);color:white;
    border-radius:12px;padding:0 18px;font-weight:bold;cursor:pointer;
}
.helper{font-size:11px;color:#999;margin-top:7px;padding-left:3px}
.faq-modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);
    align-items:center;justify-content:center;padding:20px;z-index:20;
}
.faq-modal.show{display:flex}
.modal-card{
    width:min(900px,100%);max-height:88vh;overflow:auto;
    background:white;border-radius:14px;padding:18px;
}
.modal-head{
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:-18px;background:white;padding:4px 0 12px;z-index:2;
}
.modal-head h2{font-size:18px;margin:0}
.close{border:none;background:#eee;border-radius:8px;padding:8px 11px;cursor:pointer}

.faq-search-area{
    position:sticky;
    top:35px;
    z-index:2;
    background:white;
    padding:10px 0 12px;
    border-bottom:1px solid #eee;
    margin-bottom:10px;
}
.faq-search-row{
    display:flex;
    gap:8px;
}
#faqSearchInput{
    flex:1;
    min-width:0;
    border:1px solid #ddd;
    border-radius:9px;
    padding:11px 12px;
    font-size:13px;
    outline:none;
    background:#fafafa;
}
#faqSearchInput:focus{
    background:white;
    border-color:var(--orange);
}
.faq-search-clear{
    border:1px solid #ddd;
    background:white;
    color:#555;
    border-radius:9px;
    padding:0 12px;
    cursor:pointer;
}
.faq-search-info{
    margin-top:7px;
    color:#888;
    font-size:12px;
}
.faq-category-title{
    margin:16px 0 7px;
    padding:8px 10px;
    border-left:4px solid var(--orange);
    background:#faf7f3;
    font-weight:bold;
    font-size:14px;
}
.faq-empty{
    padding:30px 10px;
    text-align:center;
    color:#888;
    font-size:13px;
}
.faq-item mark{
    background:#fff1a8;
    color:inherit;
    padding:0 2px;
    border-radius:2px;
}

.faq-item{border:1px solid #e5e5e1;border-radius:10px;margin:9px 0;overflow:hidden}
.faq-q{background:#f7f7f4;padding:12px;font-weight:bold;cursor:pointer}
.faq-a{display:none;padding:14px;line-height:1.75;font-size:14px}

.related-jump{
    cursor:pointer;
    pointer-events:auto;
}
.related-jump:hover{
    text-decoration:underline;
}
.faq-item.target-faq{
    border:2px solid var(--orange);
    box-shadow:0 0 0 5px rgba(245,130,32,.16);
    background:#fffaf5;
    transition:box-shadow .25s ease, border-color .25s ease, background .25s ease;
}

.confidence-note{
    font-size:11px;color:#999;margin-top:9px;padding-top:7px;border-top:1px solid #eee;
}
@media(max-width:600px){
    .app{width:100%;height:100dvh}
    .bubble{max-width:86%;font-size:13px}
    .header{padding:12px}
    .chat{padding:16px 10px 22px}
    .quick{margin-left:38px}
    .send{padding:0 13px}
}
</style>
</head>

</div>

<script>
const faqData = [


/* =====================================================
   퇴직금 FAQ
===================================================== */


{
id:"retirement-1",
category:"퇴직금",
question:"Q1. 퇴직금은 언제 지급되나요?",
answer:`

<span class="answer-title">
✔ 기본 원칙
</span>

퇴직금은 퇴직일로부터
<strong>14일 이내에 지급하는 것이 원칙</strong>입니다. <br>

다만 특별한 사정이 있는 경우에는
근로자와 회사 간 합의에 따라 지급기일을 연장할 수 있습니다.


<span class="answer-title">
✔ 어디로 지급되나요?
</span>

퇴직금은 원칙적으로 근로자가 지정한
<strong>개인형퇴직연금(IRP) 계좌</strong>로 지급됩니다.


<span class="answer-title">
✔ 퇴직 전에 무엇을 해야 하나요?
</span>

퇴직금 지급에 차질이 없도록
회사에서 안내한 기한까지
본인 명의의 IRP 계좌(계좌개설확인서) 등 필요한 정보를 제출해주세요.


<span class="answer-title">
✔ 지급금액은 언제 확정되나요?
</span>

퇴직 시점의 급여·수당 및 평균임금 등을 반영하여
최종 퇴직금이 산정됩니다.

따라서 사전에 조회한 예상퇴직금과
실제 지급액에는 차이가 있을 수 있습니다.


<div class="related">

<span class="related-title">
🔗 함께 보면 좋은 질문
</span>

<a class="related-link"
>
→ Q4. 퇴직금을 꼭 IRP로 받아야 하나요?
</a>

<a class="related-link"
>
→ Q5. 퇴직금 예상 금액을 미리 확인할 수 있나요?
</a>

</div>
`
},



{
id:"retirement-2",
category:"퇴직금",
question:"Q2. 퇴직금은 어떻게 계산되나요?",
answer:`

<span class="answer-title">
✔ 기본 계산방법<br>
</span>

퇴직연금은 크게 DB형(확정급여형)과 DC형(확정기여형) 으로 구분되며, 유형에 따라 퇴직급여가 산정되는 방식이 다릅니다.<br><br>

① DB형 (확정급여형) 
DB형은 퇴직 시 받을 퇴직급여를 기준으로 산정하는 방식입니다.

</span>

<div class="answer-box">

<strong>
DB형 퇴직금 = 1일 평균임금 × 30일 × 계속근로기간 ÷ 365

</strong>

</div>

② DC형 (확정기여형) 
DC형은 회사가 매년 근로자의 DC계정에 연간 임금총액의 1/12 이상에 해당하는 부담금을 납입하고, 근로자가 적립금을 직접 운용합니다.

</span>

<div class="answer-box">

<strong>
회사부담금 = 연간 임금총액 × 1/12 이상<br>
최종적립금 = 회사가 납입한 부담금 + 운용손익

</strong>

</div>
<br>
퇴직금은 계속근로기간 1년에 대하여
30일분 이상의 평균임금을 기준으로 산정합니다.


<span class="answer-title">
✔ 평균임금이란?
</span>

원칙적으로 퇴직 등 평균임금을 산정해야 하는 사유가 발생한 날
이전 <strong>3개월 동안 지급된 임금 총액을
해당 기간의 총일수로 나누어</strong> 산정합니다.


<span class="answer-title">
✔ 모든 급여가 동일하게 반영되나요?
</span>

아닙니다.

급여 항목의 성격에 따라 평균임금 포함 여부가 달라질 수 있습니다.<br>

또한 출산전후휴가, 육아휴직 등
법령에서 정한 기간이 평균임금 산정기간에 포함되어 있는 경우
해당 기간 및 임금을 제외하여 평균임금을 산정할 수 있습니다.


<span class="answer-title">
✔ 평균임금이 통상임금보다 낮다면?
</span>

산정된 평균임금이 통상임금보다 낮은 경우에는
통상임금을 평균임금으로 적용합니다.


<div class="related">

<span class="related-title">
🔗 함께 보면 좋은 질문
</span>

<a class="related-link"
>
→ Q5. 퇴직금 예상 금액을 미리 확인할 수 있나요?
</a>

<a class="related-link"
>
→ Q6. 퇴직금 중간정산을 받은 경우 어떻게 계산되나요?
</a>

</div>
`
},



{
id:"retirement-3",
category:"퇴직금",
question:"Q3. 퇴직금에도 세금이 부과되나요?",
answer:`

<span class="answer-title">
✔ 네. 퇴직소득세가 발생합니다.
</span>

퇴직금은 일반적인 급여와 별도로
<strong>퇴직소득</strong>으로 과세되며,
퇴직소득세 및 지방소득세가 적용됩니다.


<span class="answer-title">
✔ 근로소득세와 같은 방식으로 계산되나요?
</span>

아닙니다.

퇴직소득은 장기간에 걸쳐 형성된 소득이라는 특성을 고려하여
근로소득과 별도의 방식으로 세액을 계산합니다.<br>

따라서 단순히 퇴직금에 일정 세율을 곱하는 방식이 아니며,
<strong>근속연수와 퇴직급여액 등에 따라
개인별 세액이 달라질 수 있습니다.</strong>


<span class="answer-title">
✔ IRP로 받으면 세금을 바로 내나요?
</span>

퇴직금을 IRP로 이전하는 경우
퇴직소득세를 즉시 납부하지 않고,
실제 연금 또는 일시금을 수령하는 시점까지
<strong>과세를 이연</strong>할 수 있습니다.


<span class="answer-title">
✔ 정확한 세금은 언제 확인할 수 있나요?
</span>

최종 퇴직금이 확정되면
퇴직소득세도 함께 산정되며,
퇴직소득 원천징수영수증에서 관련 내용을 확인할 수 있습니다.


<div class="related">

<span class="related-title">
🔗 함께 보면 좋은 질문
</span>

<a class="related-link"
>
→ Q9. 퇴직소득 원천징수영수증은 언제 받을 수 있나요?
</a>

<a class="related-link"
>
→ Q10. 퇴직 후 IRP를 해지하면 어떻게 되나요?
</a>

</div>
`
},



{
id:"retirement-4",
category:"퇴직금",
question:"Q4. 퇴직금을 꼭 IRP로 받아야 하나요?",
answer:`

<span class="answer-title">
✔ 기본 원칙
</span>

퇴직금은 원칙적으로 근로자가 지정한
<strong>개인형퇴직연금(IRP) 계좌</strong>으로 지급합니다.


<span class="answer-title">
✔ 일반계좌로 받을 수 있는 경우도 있나요?
</span>

네.

법령에서 정한 예외사유에 해당하는 경우에는

<div class="answer-box">

• 55세 이후 퇴직하여 퇴직급여를 받는 경우<br>

• 퇴직급여가 법령에서 정한 일정 금액 이하인 경우<br>

• 사망으로 인한 당연퇴직 및 외국인 근로자가 국외 출국한 경우<br>

• 다른 법령에 따라 퇴직급여의 전부 또는 일부를
공제하도록 한 경우

</div>


<span class="answer-title">
✔ IRP는 언제 만들어야 하나요?
</span>

퇴직금 지급에 차질이 없도록
회사에서 안내하는 기한까지
본인 명의의 IRP 계좌정보를 제출해주세요.


<div class="related">

</a>

<a class="related-link"
>
→ Q10. 퇴직 후 IRP를 해지하면 어떻게 되나요?
</a>

</div>
`
},



{
id:"retirement-5",
category:"퇴직금",
question:"Q5. 퇴직금 예상 금액을 미리 확인할 수 있나요?",
answer:`

<span class="answer-title">
✔ 네. HR+에서 예상퇴직금을 확인할 수 있습니다.
</span>


<div class="route">

조회 경로 :
HR+ &gt; 보상 &gt; 퇴직연금 &gt; 예상퇴직금 조회

</div>


<span class="answer-title">
✔ 조회금액이 실제 퇴직금과 동일한가요?
</span>

예상퇴직금은 조회 시점의 정보를 기준으로 산정한
<strong>참고금액</strong>입니다.<br>

실제 퇴직금은 최종 퇴직일을 기준으로 산정되므로

answer:`

국민연금·건강보험·고용보험은

산재보험료는 사업주가 부담합니다.

✔ 국민연금
</span>

2026년 국민연금 보험료율은
<strong>기준소득월액의 9.5%</strong>이며,
근로자와 사용자가 각각 절반씩 부담합니다.<br>

국민연금은 실제 매월 급여액에
단순히 보험료율을 곱하는 것이 아니라
<strong>기준소득월액</strong>을 기준으로 보험료를 산정합니다.

<span class="answer-title">
✔ 건강보험
</span>
2026년 건강보험료는 2025년도 소득 기준으로 월보험료를 산정하여, 26.04월~27.03월까지 납부하게 됩니다.<br>
- 건강보험료: 2025년 확정 소득으로 산정된 개인별 보수월액 x 3.595%<br>
- 장기요양보험료: 건강보험료 x 0.4724% / 3.595%<br>
* 개인별 보수월액: (2025년도 원천징수영수증 상 총급여 - 우리사주조합인출금) / 근무월수<br>

<span class="answer-title">
✔ 실제 급여와 보험료 계산기준이 다른 이유는?

국민연금 및 건강보험 등은
관련 법령에서 정한 소득·보수 기준에 따라 보험료가 산정되므로
실제 월 급여액과 보험료 산정기준이
반드시 일치하지 않을 수 있습니다.

/* ---------------------------
   유틸
---------------------------- */
function stripHTML(html){
    const div=document.createElement("div");
    div.innerHTML=html;
    return div.textContent||div.innerText||"";
}

function normalize(text){
    return String(text||"")
        .toLowerCase()
        .replace(/[^0-9a-zA-Z가-힣\s]/g," ")
        .replace(/\s+/g," ")
        .trim();
}

function tokens(text){
    return normalize(text).split(" ").filter(v=>v.length>=2);
}

function escapeHTML(text){
    const div=document.createElement("div");
    div.textContent=text;
    return div.innerHTML;
}

/* ---------------------------
   FAQ 매칭 점수
---------------------------- */
function scoreFAQ(input,item){
    const meta=chatbotMeta[item.id]||{keywords:[],similarQuestions:[]};
    const q=normalize(input);
    const inputTokens=tokens(input);
    const faqQ=normalize(item.question);
    const faqA=normalize(stripHTML(item.answer));
    let score=0;

    meta.keywords.forEach(k=>{
        const key=normalize(k);
        if(key && q.includes(key)) score += key.length>=5 ? 16 : 11;
    });

    meta.similarQuestions.forEach(s=>{
        const st=normalize(s);
        const stokens=tokens(s);
        let overlap=0;
        stokens.forEach(t=>{ if(q.includes(t)) overlap++; });

        if(q===st) score+=55;
        else if(overlap>=3) score+=28;
        else if(overlap===2) score+=17;
        else if(overlap===1) score+=6;
    });

    inputTokens.forEach(t=>{
        if(faqQ.includes(t)) score+=8;
        else if(faqA.includes(t)) score+=2;
    });

    // 자주 발생할 핵심 의도 보정
    if(q.includes("일반") && (q.includes("통장")||q.includes("계좌")) && item.id==="retirement-4") score+=35;
    if(q.includes("퇴사") && q.includes("건강보험") && item.id==="insurance-9") score+=40;
    if(q.includes("휴직") && q.includes("건강보험") && item.id==="insurance-6") score+=40;
    if(q.includes("육아휴직") && item.id==="insurance-7") score+=28;
    if(q.includes("db") && q.includes("dc") && item.id==="retirement-8") score+=40;
    if(q.includes("중간정산") && item.id==="retirement-6") score+=40;
    if(q.includes("실업급여") && item.id==="insurance-8") score+=40;
    if(q.includes("원천징수영수증") && item.id==="retirement-9") score+=40;
    if(q.includes("irp") && q.includes("해지") && item.id==="retirement-10") score+=40;

    return score;
}

function findBestFAQ(input){
    return faqData
        .map(item=>({item,score:scoreFAQ(input,item)}))
        .sort((a,b)=>b.score-a.score);
}

function addQuickButtons(){

function cleanAnswerHTML(answerHTML, sourceItem){
    /*
       현재 FAQ 데이터의 "함께 보면 좋은 질문" 링크에는
       이동 대상 ID가 저장되어 있지 않고 화면에 Q번호만 적혀 있습니다.
       따라서 링크 문구의 Q번호를 읽어서 같은 카테고리의 실제 FAQ ID를 연결합니다.
    */
    const temp=document.createElement("div");
    temp.innerHTML=answerHTML;

    temp.querySelectorAll("a.related-link").forEach(link=>{
        const text=link.textContent || "";
        const match=text.match(/Q\s*(\d+)/i);

        if(!match || !sourceItem) return;

        const qNumber=Number(match[1]);

        const target=faqData.find(item=>{
            if(item.category !== sourceItem.category) return false;
            const targetMatch=item.question.match(/Q\s*(\d+)/i);
            return targetMatch && Number(targetMatch[1])===qNumber;
        });

        if(target){
            link.href="#faq-" + target.id;
            link.classList.add("related-jump");
            link.dataset.faqId=target.id;
            link.removeAttribute("on click");
        }
    });

    return temp.innerHTML;
}

function botReplyFor(input){
    const ranked=findBestFAQ(input);
    const best=ranked[0];
    const second=ranked[1];

    // 낮은 점수: 모른다고 처리
    if(!best || best.score < 22){
        return `
            죄송합니다. 질문하신 내용을 정확히 이해하지 못했습니다.<br><br>
            <strong>퇴직금·4대보험과 관련된 내용을 다른 표현으로 다시 질문해주세요.</strong><br>
            그래도 원하는 답변을 찾지 못한 경우 인재관리팀으로 문의해주세요.
        `;
    }

    // 1, 2위 점수가 너무 비슷하고 전체 점수도 높지 않으면 억지 답변하지 않음
    if(second && best.score < 55 && (best.score-second.score) < 7){
        return `
            죄송합니다. 질문하신 내용이 여러 FAQ와 비슷하여 정확한 의도를 판단하기 어렵습니다.<br><br>
            질문을 조금 더 구체적으로 입력해주세요.<br>
            예) <strong>"퇴사 후 건강보험은 어떻게 되나요?"</strong>
        `;
    }

    return `
        질문하신 내용은 <strong>${escapeHTML(best.item.question)}</strong>와 가장 관련이 있습니다.<br><br>
        ${cleanAnswerHTML(best.item.answer, best.item)}
    `;
}

function sendQuestion(forcedText){
    const input=document.getElementById("messageInput");
    const text=(forcedText!==undefined?forcedText:input.value).trim();
    if(!text) return;

    addUser(text);
    input.value="";

    const typing=addTyping();

    setTimeout(()=>{
        typing.remove();
        addBot(botReplyFor(text));
    },450);
}

document.getElementById("sendButton").onclick=()=>sendQuestion();
document.getElementById("messageInput").addEventListener("keydown",e=>{
    if(e.key==="Enter") sendQuestion();
});

/* ---------------------------

---------------------------- */

/*
   기존 FAQ 원문 안의 도
   혹시 남아 있을 경우 정상 동작하도록 전역 함수를 제공합니다.
*/
function goToFAQ(faqId){
    jumpToRelatedFAQ(faqId);
}

function jumpToRelatedFAQ(faqId){

    const targetData=faqData.find(item=>item.id===faqId);
    if(!targetData) return;

    const modal=document.getElementById("faqModal");
    const search=document.getElementById("faqSearchInput");

    /*
       검색 필터 때문에 대상 FAQ가 화면에서 사라져 있을 수 있으므로
       검색어를 먼저 초기화하고 전체 FAQ를 다시 그립니다.
    */
    if(search){
        search.value="";
    }

    renderFAQList();

    /*
       챗봇 화면에서 눌렀다면 전체 FAQ 창을 열고,
       이미 전체 FAQ 안에서 눌렀다면 현재 창을 그대로 사용합니다.
    */
    if(modal){
        modal.classList.add("show");
    }

    requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{

            const target=document.getElementById("faq-" + faqId);

            if(!target) return;

            /*
               1. 해당 답변 자동 펼침
            */
            const answer=target.querySelector(".faq-a");
            if(answer){
                answer.style.display="block";
            }

            /*
               2. 이전 강조 제거 후 대상 강조
            */
            document.querySelectorAll(".faq-item.target-faq")
                .forEach(el=>el.classList.remove("target-faq"));

            target.classList.add("target-faq");

            /*
               3. 해당 Q로 부드럽게 자동 이동
            */
            target.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

            /*
               4. 잠시 후 강조만 제거
               답변은 펼쳐진 상태로 유지
            */
            setTimeout(()=>{
                target.classList.remove("target-faq");
            },2200);

        });
    });
}


/*
   챗봇 답변 / 전체 FAQ 어디에서 클릭하든 동일하게 처리
*/
document.addEventListener("click",function(event){

    const link=event.target.closest(".related-jump");

    if(!link) return;

    event.preventDefault();
    event.stopPropagation();

    const faqId=link.getAttribute("data-faq-id");

    if(faqId){
        jumpToRelatedFAQ(faqId);
    }

});

/* ---------------------------
   전체 FAQ 모달
---------------------------- */
function escapeRegExp(text){
    return text.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function highlightFAQText(htmlText,keyword){
    if(!keyword) return htmlText;

    const temp=document.createElement("div");
    temp.innerHTML=htmlText;

    const regex=new RegExp("(" + escapeRegExp(keyword) + ")","gi");

    function walk(node){
        if(node.nodeType===3){
            if(!node.nodeValue.trim()) return;

            const frag=document.createDocumentFragment();
            const parts=node.nodeValue.split(regex);

            parts.forEach(part=>{
                if(part.toLowerCase()===keyword.toLowerCase()){
                    const mark=document.createElement("mark");
                    mark.textContent=part;
                    frag.appendChild(mark);
                }else{
                    frag.appendChild(document.createTextNode(part));
                }
            });

            node.parentNode.replaceChild(frag,node);
            return;
        }

        if(node.nodeType===1 && node.tagName!=="script" && node.tagName!=="STYLE"){
            Array.from(node.childNodes).forEach(walk);
        }
    }

    Array.from(temp.childNodes).forEach(walk);
    return temp.innerHTML;
}

function renderFAQList(){
    const list=document.getElementById("faqList");
    const searchInput=document.getElementById("faqSearchInput");
    const info=document.getElementById("faqSearchInfo");

    const keyword=searchInput ? searchInput.value.trim() : "";
    const normalizedKeyword=normalize(keyword);

    const filtered=faqData.filter(item=>{
        if(!normalizedKeyword) return true;

        const searchable=normalize(
            item.question + " " + stripHTML(item.answer) + " " + item.category
        );

        return searchable.includes(normalizedKeyword);
    });

    list.innerHTML="";

    if(info){
        info.textContent = keyword
            ? `검색 결과 ${filtered.length}건 · "${keyword}"`
            : `FAQ ${filtered.length}건`;
    }

    if(filtered.length===0){
        list.innerHTML=`
            <div class="faq-empty">
                검색어와 일치하는 FAQ를 찾지 못했습니다.<br><br>
                다른 단어로 다시 검색해주세요.
            </div>
        `;
        return;
    }

    let currentCategory="";

    filtered.forEach(item=>{
        if(currentCategory!==item.category){
            currentCategory=item.category;

            const category=document.createElement("div");
            category.className="faq-category-title";
            category.textContent=item.category==="퇴직금"
                ? "💰 퇴직금 FAQ"
                : "🛡️ 4대보험 FAQ";

            list.appendChild(category);
        }

        const box=document.createElement("div");
        box.className="faq-item";
        box.dataset.faqId=item.id;
        box.id="faq-" + item.id;

        const highlightedQuestion=highlightFAQText(
            escapeHTML(item.question),
            keyword
        );

        const highlightedAnswer=highlightFAQText(
            cleanAnswerHTML(item.answer, item),
            keyword
        );

        box.innerHTML=`
            <div class="faq-q">${highlightedQuestion}</div>
            <div class="faq-a">${highlightedAnswer}</div>
        `;

        const answer=box.querySelector(".faq-a");

        // 검색 중에는 해당 답변을 자동으로 펼쳐서
        // 답변 안의 검색어도 바로 확인할 수 있게 함.
        if(keyword){
            answer.style.display="block";
        }

        box.querySelector(".faq-q").onclick=()=>{
            answer.style.display=answer.style.display==="block"?"none":"block";
        };

        list.appendChild(box);
    });
}

renderFAQList();

document.getElementById("faqSearchInput").addEventListener("input",()=>{
    renderFAQList();
});

document.getElementById("faqSearchClear").addEventListener("click",()=>{
